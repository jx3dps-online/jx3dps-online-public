server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # SPA 路由：所有路径回退到 index.html
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;

        # HTML 文档（含 SPA 回退）不缓存，保证发布后立即拿到最新版本
        # 修复「切心法整页刷新命中旧 index.html → 页面变旧」问题
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 带 contenthash 的静态资源长缓存
    location /static/ {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # jcl-wasm：版本清单实时，版本文件长缓存
    location = /jcl-wasm/manifest.json {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /jcl-wasm/versions/ {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 带版本号/内容哈希的固定文件长缓存
    location = /pako-2.1.0.min.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.png {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /nextApi/ {
        proxy_pass https://next2.jx3box.com/;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
